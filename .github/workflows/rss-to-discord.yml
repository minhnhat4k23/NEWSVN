name: RSS to Discord

on:
  # GitHub throttles frequent schedules (observed ~hourly in practice), so this
  # is only a safety net - an external cron service drives the real cadence by
  # calling the workflow_dispatch API.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs overlap: they would both read the same state.json and
# repost the same articles.
concurrency:
  group: rss-to-discord
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run bot
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: node src/index.js

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: update feed state"
            git push
          else
            echo "state.json unchanged, nothing to commit."
          fi

